<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000">
  <title>GTA VI — Countdown</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(rgba(5,3,10,.42),rgba(5,3,10,.72)), url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=2400&q=90') center/cover fixed, linear-gradient(135deg,#ff4fa3,#ff9a3d,#24113d);
      background-attachment: fixed;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15),
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      z-index: 1;
      animation: scanlines 8s linear infinite;
    }

    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(255, 50, 100, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 150, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes scanlines {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(10px);
      }
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      position: relative;
      z-index: 2;
    }

    header {
      margin-bottom: 60px;
    }

    .badge {
      font-size: 12px;
      letter-spacing: 4px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .logo {
      font-size: 72px;
      font-weight: 900;
      margin-bottom: 10px;
      letter-spacing: -2px;
      line-height: 1;
    }

    .gta {
      display: block;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }

    .six {
      display: block;
      color: #ff4fa3;
      font-size: 96px;
      font-family: 'Arial Black', Impact, sans-serif;
      font-style: italic;
      text-shadow: 4px 5px 0 #ffcf45, 0 0 35px rgba(255,79,163,.75);
      margin-top: -10px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      color: #666;
      text-transform: uppercase;
      margin-top: 20px;
      font-weight: 400;
    }

    .countdown-section {
      margin: 60px 0;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin: 40px 0;
    }

    .time-unit {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px 15px;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .time-unit:hover {
      background: rgba(255, 0, 0, 0.05);
      border-color: rgba(255, 0, 0, 0.3);
    }

    .time-value {
      display: block;
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      color: #fff;
      letter-spacing: -1px;
    }

    .time-label {
      display: block;
      font-size: 11px;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      font-weight: 600;
    }

    .launch-info {
      margin: 50px 0 0;
      padding-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .launch-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .launch-date {
      font-size: 28px;
      font-weight: 900;
      color: #ffd34d;
      margin-bottom: 8px;
      text-shadow: 0 0 16px rgba(255,79,163,.55);
    }

    .launch-time {
      font-size: 13px;
      letter-spacing: 1px;
      color: #888;
    }

    .status {
      margin-top: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #00ff00;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 48px;
      }

      .six {
        font-size: 64px;
      }

      .countdown {
        gap: 10px;
      }

      .time-unit {
        padding: 20px 10px;
      }

      .time-value {
        font-size: 32px;
      }

      .launch-date {
        font-size: 22px;
      }
    }
  
/* ===== RESPONSIVIDADE PARA CELULAR ===== */
html {
  width: 100%;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  overflow-y: auto;
  padding:
    max(16px, env(safe-area-inset-top))
    max(14px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
}

.container {
  width: min(100%, 720px);
}

@media (max-width: 700px) {
  body {
    align-items: flex-start;
    padding-top: 28px;
    padding-bottom: 28px;
  }

  .container {
    width: 100%;
  }

  header {
    margin-bottom: 34px;
  }

  .badge {
    font-size: 9px;
    letter-spacing: 2px;
    margin-bottom: 14px;
  }

  .logo {
    font-size: clamp(52px, 17vw, 78px);
  }

  .six {
    font-size: clamp(70px, 21vw, 100px);
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 14px;
  }

  .countdown-section {
    margin: 30px 0;
  }

  .countdown {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 25px 0;
  }

  .time-unit {
    padding: 20px 8px;
    min-width: 0;
  }

  .time-value {
    font-size: clamp(34px, 11vw, 48px);
  }

  .time-label {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .launch-info {
    margin-top: 30px;
    padding-top: 25px;
  }

  .launch-label {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .launch-date {
    font-size: clamp(20px, 6vw, 28px);
  }

  .launch-time {
    font-size: 10px;
  }

  .status {
    margin-top: 30px;
    font-size: 9px;
    letter-spacing: 1.5px;
  }
}

@media (max-width: 380px) {
  body {
    padding-left: 10px;
    padding-right: 10px;
  }

  header {
    margin-bottom: 25px;
  }

  .badge {
    font-size: 8px;
    letter-spacing: 1.5px;
  }

  .logo {
    font-size: 48px;
  }

  .six {
    font-size: 62px;
  }

  .countdown {
    gap: 7px;
  }

  .time-unit {
    padding: 17px 5px;
  }

  .time-value {
    font-size: 32px;
  }

  .launch-date {
    font-size: 19px;
  }
}

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">Rockstar Games Presents</div>
      <div class="logo">
        <span class="gta">GTA</span>
        <span class="six">VI</span>
      </div>
      <p class="subtitle">Vice City is Waiting</p>
    </header>

    <section class="countdown-section">
      <div class="countdown" id="countdown">
        <div class="time-unit">
          <span class="time-value" id="days">000</span>
          <span class="time-label">Dias</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="hours">00</span>
          <span class="time-label">Horas</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="minutes">00</span>
          <span class="time-label">Min</span>
        </div>
        <div class="time-unit">
          <span class="time-value" id="seconds">00</span>
          <span class="time-label">Seg</span>
        </div>
      </div>

      <div class="launch-info">
        <div class="launch-label">Lançamento Global</div>
        <div class="launch-date">19 NOVEMBRO 2026</div>
        <div class="launch-time">00:00 — Horário de Brasília</div>
      </div>
    </section>

    <div class="status">
      <span class="status-dot"></span>
      <span>COUNTDOWN ATIVO</span>
    </div>
  </div>

  <script>
    function updateCountdown() {
      // Data de lançamento: 19 de novembro de 2026 00:00 (Brasília)
      const launchDate = new Date('2026-11-19T00:00:00-03:00').getTime();
      const now = new Date().getTime();
      const difference = launchDate - now;

      if (difference > 0) {
        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((difference / 1000 / 60) % 60);
        const seconds = Math.floor((difference / 1000) % 60);

        document.getElementById('days').textContent = String(days).padStart(3, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
      } else {
        document.getElementById('days').textContent = '000';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.querySelector('.status span:last-child').textContent = 'LANÇADO!';
        document.querySelector('.status-dot').style.background = '#ff0000';
      }
    }

    // Atualiza o countdown a cada segundo
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
